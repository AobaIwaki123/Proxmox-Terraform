version: '3'

tasks:
  help:
    cmds:
      - task --list
    desc: ヘルプを表示
    silent: true
    
  create-ct:
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Error: CT_NAME is required."
          exit 1
        fi
      - cp -r template/container envs/{{.CLI_ARGS}}
      - echo "envs/{{.CLI_ARGS}} created."
    desc: Proxmox ContainerのためのTerraform Templateを作成. 例 `task create-ct -- CT_NAME`
    silent: true

  create-provider:
    cmds:
      - test -e inventory/provider.tf || cp modules/proxmox_vm/provider.tf.example inventory/provider.tf
      - test -e modules/proxmox_lxc/provider.tf || cp modules/proxmox_lxc/provider.tf.example modules/proxmox_lxc/provider.tf
    desc: 不足している Terraform Provider 設定を作成（既存ファイルは保持）
    silent: true

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    container_name: proxmox-webui-backend
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: proxmox-webui-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    restart: unless-stopped

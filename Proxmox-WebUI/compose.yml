services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    container_name: proxmox-webui-backend
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./frontend/my-app:/app
    ports:
      - "3000:3000"
    command: ["/root/.bun/bin/bun", "dev"]
    restart: unless-stopped
